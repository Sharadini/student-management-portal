<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Management Portal | Registration</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Student Registration</h1>
    <p>Enter your details in the form below</p>
  </header>
  <nav aria-label="Main navigation">
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="registration.html">Student Registration</a>
    <a href="courses.html">Courses</a>
    <a href="contact.html">Contact</a>
  </nav>
  <main>
    <section class="card">
      <h2>Registration Form</h2>
      <form action="#" method="post">
        <label for="fullname">Full Name</label>
        <input type="text" id="fullname" name="fullname" placeholder="Enter your full name" required>

        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" placeholder="name@example.com" required>

        <label for="phone">Phone Number</label>
        <input type="tel" id="phone" name="phone" placeholder="Enter your phone number">

        <label for="dob">Date of Birth</label>
        <input type="date" id="dob" name="dob" required>

        <label for="course">Select Course</label>
        <select id="course" name="course" required>
          <option value="">-- Choose a course --</option>
          <option value="computer-science">Computer Science</option>
          <option value="information-technology">Information Technology</option>
          <option value="electronics">Electronics and Communication</option>
          <option value="mechanical">Mechanical Engineering</option>
        </select>

        <label for="address">Address</label>
        <textarea id="address" name="address" rows="4" placeholder="Enter your address"></textarea>

        <button type="submit">Submit Registration</button>
      </form>
      <p class="note">Note: This is a static HTML form. It does not store or send registration details.</p>
    </section>
  </main>
  <footer><p>&copy; 2026 Student Management Portal</p></footer>
</body>
</html>
